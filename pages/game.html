<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Invaders</title>
    <link rel="stylesheet" href="../css/game.css" />
    <link rel="stylesheet" href="../css/pause.css" />
    <link rel="stylesheet" href="../css/main.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="game-wrapper">
      <canvas id="gameCanvas"></canvas>

      <!-- HUD overlay -->
      <div class="hud">
        <div class="hearts">
          <!-- <img class="heart" src="../assets/images/lives.webp" alt="">
          <img class="heart" src="../assets/images/lives.webp" alt="">
          <img class="heart" src="../assets/images/lives.webp" alt=""> -->
        </div>
        <span id="score">0</span>
      </div>

      <!-- Pause Menu -->
      <div id="pauseMenu" class="pause-menu-container">
        <div class="flex-container">
          <p>PAUSED</p>
          <div class="buttons">
            <button type="button" id="resumeBtn" onclick="window.game.resume()">
              RESUME
            </button>
            <button
              type="button"
              id="restartBtn"
              onclick="window.location.reload()"
            >
              RESTART
            </button>
            <button
              type="button"
              id="exitBtn"
              onclick="window.location.href = '../index.html'"
            >
              EXIT TO MENU
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../scripts/core/Game.js"></script>
  </body>
</html>
