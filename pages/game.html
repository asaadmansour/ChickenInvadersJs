<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicken Invaders</title>
  <link rel="stylesheet" href="../css/game.css" />
  <link rel="stylesheet" href="../css/pause.css" />
  <link rel="stylesheet" href="../css/screen-blocker.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/images/chicken.png" type="image/png" size="16x16">
</head>

<body>
  
  <div class="screen-blocker">
    <h1 class="blocker-text">Please Use Desktop Screen</h1>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>

    
    <div id="countdownOverlay" class="countdown-overlay">
      <div class="countdown-container">
        <div id="countdownNumber" class="countdown-number">3</div>
        <div id="countdownText" class="countdown-text"></div>
      </div>
    </div>

    <!-- Wave Intro Overlay -->
    <div id="waveIntroOverlay" class="wave-intro-overlay hidden">
      <div class="wave-intro-container">
        <div id="waveNumber" class="wave-number"></div>
        <div id="waveTitle" class="wave-title"></div>
      </div>
    </div>

    <!-- Pause Menu Overlay -->
    <div id="pauseMenuContainer" class="pause-menu-container">
      <div class="flex-container">
        <p>PAUSED</p>
        <div class="buttons">
          <button type="button" id="resumeBtn">RESUME</button>
          <button type="button" id="restartBtn">RESTART</button>
          <button type="button" id="exitBtn">EXIT TO MENU</button>
        </div>
      </div>
    </div>

    <!-- HUD overlay -->
    <div class="hud">
      <div class="hearts-container">
        <div class="hearts">
          Lives:
        </div>
      </div>
      <div class="scores">
        <span id="score">Score: 0</span>
      </div>
    </div>
  </div>

  <script type="module" src="../scripts/core/Game.js"></script>
</body>

</html>
