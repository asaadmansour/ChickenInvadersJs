<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="icon" href="../assets/images/chicken.png" type="image/png" size="16x16">
  <link rel="stylesheet" href="../css/screen-blocker.css" />
</head>

<body>
  <!-- Desktop-Only Screen Blocker -->
  <div class="screen-blocker">
    <h1 class="blocker-text">Please Use Desktop Screen</h1>
  </div>


    <div class="ambient-glow ambient-glow-1"></div>
    <div class="ambient-glow ambient-glow-2"></div>

    <div class="container">
        <h1>USER SETTINGS</h1>

        <div class="instructions-card">
            <div class="instruction-section">
                <h2>SOUND CONTROLS</h2>
                <ul class="control-list">
                    <li class="control-item">
                        <div class="mute-control">
                            <input id="muteMusicCheckbox" type="checkbox" placeholder="." />
                            <label class="toggleSwitch" for="muteMusicCheckbox">
                                <div class="speaker">
                                    <svg viewBox="0 0 75 75" version="1.0" xmlns="http://www.w3.org/2000/svg">
                                        <path style="stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:#fff;"
                                            d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z">
                                        </path>
                                        <path style="fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round"
                                            d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6">
                                        </path>
                                    </svg>
                                </div>

                                <div class="mute-speaker">
                                    <svg stroke-width="5" stroke="#fff" viewBox="0 0 75 75" version="1.0">
                                        <path stroke-linejoin="round" fill="#fff" d="m39,14-17,15H6V48H22l17,15z">
                                        </path>
                                        <path stroke-linecap="round" fill="#fff" d="m49,26 20,24m0-24-20,24"></path>
                                    </svg>
                                </div>
                            </label>
                        </div>
                        <p>
                            Mute Music
                        </p>
                    </li>
                    <li class="control-item">
                        <div class="mute-control">
                            <input id="muteSoundEffectsCheckbox" type="checkbox" placeholder="." />
                            <label class="toggleSwitch" for="muteSoundEffectsCheckbox">
                                <div class="speaker">
                                    <svg viewBox="0 0 75 75" version="1.0" xmlns="http://www.w3.org/2000/svg">
                                        <path style="stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:#fff;"
                                            d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z">
                                        </path>
                                        <path style="fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round"
                                            d="M48,27.6a19.5,19.5 0 0 1 0,21.4M55.1,20.5a30,30 0 0 1 0,35.6M61.6,14a38.8,38.8 0 0 1 0,48.6">
                                        </path>
                                    </svg>
                                </div>

                                <div class="mute-speaker">
                                    <svg stroke-width="5" stroke="#fff" viewBox="0 0 75 75" version="1.0">
                                        <path stroke-linejoin="round" fill="#fff" d="m39,14-17,15H6V48H22l17,15z">
                                        </path>
                                        <path stroke-linecap="round" fill="#fff" d="m49,26 20,24m0-24-20,24"></path>
                                    </svg>
                                </div>
                            </label>
                        </div>
                        <p>
                            Mute Sound Effects
                        </p>
                    </li>
                </ul>
            </div>
        </div>

        <div class="buttons">
            <button type="button" id="backToMenuBtn" class="nav-btn">BACK TO MENU</button>
            <button type="button" id="startNowBtn" class="nav-btn">START GAME</button>
        </div>
    </div>

    <script type="module" src="../scripts/pages/settings.js"></script>
</body>

</html>
