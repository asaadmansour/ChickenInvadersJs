<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>High Scores</title>
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/scoreboard.css" />
  <link rel="icon" href="../assets/images/chicken.png" type="image/png" size="16x16">
  <link rel="stylesheet" href="../css/screen-blocker.css" />
</head>

<body>
  <!-- Desktop-Only Screen Blocker -->
  <div class="screen-blocker">
    <h1 class="blocker-text">Please Use Desktop Screen</h1>
  </div>

  <!-- Ambient Glow Lights -->
  <div class="ambient-glow ambient-glow-1"></div>
  <div class="ambient-glow ambient-glow-2"></div>
  <div class="ambient-glow ambient-glow-3"></div>

  <!-- Shooting Stars -->
  <div class="shooting-star shooting-star-1"></div>
  <div class="shooting-star shooting-star-2"></div>
  <div class="shooting-star shooting-star-3"></div>

  <div class="container">
    <h1>HIGH SCORES</h1>

    <!-- New Pilot Section -->
    <div class="new-pilot">
      <h2>Search Pilot</h2>
      <div class="input-group">
        <input type="text" id="playerNameInput" placeholder="Enter Player Name..." />
        <button id="submitBtn">SEARCH</button>
      </div>
    </div>

    <!-- Loader -->
    <div id="loader" class="loader-container">
      <div class="loader-spinner"></div>
      <p class="loader-text">Loading Scores...</p>
    </div>

    <!-- Score Table -->
    <div id="scoreTable" class="table-header hidden">
      <span>RANK</span>
      <span>PILOT</span>
      <span>SCORE</span>
    </div>
    <ul id="scoreList" class="hidden"></ul>

    <p id="emptyState" class="hidden">No scores yet! Play the game to set a new high score.</p>
    <p id="noSearchResults" class="hidden">No pilots found matching your search. Try a different name.</p>

    <!-- Buttons -->
    <div class="buttons">
      <button id="backBtn">BACK TO HOME</button>
      <button id="newGameBtn">START NEW GAME</button>
    </div>
  </div>

  <script type="module" src="../scripts/pages/scoreboard.js"></script>
</body>

</html>
