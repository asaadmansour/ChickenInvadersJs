<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Invaders - Paused</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pause.css">
    <link rel="icon" href="../assets/images/chicken.png" type="image/png" size="16x16">
</head>

<body>
    <div class="game-container">
        <div class="pause-menu-container active" style="opacity: 1; visibility: visible; pointer-events: all;">
            <div class="flex-container">
                <p>PAUSED</p>
                <div class="buttons">
                    <button type="button" id="resumeBtn">RESUME</button>
                    <button type="button" id="restartBtn">RESTART</button>
                    <button type="button" id="exitBtn">EXIT TO MENU</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("resumeBtn").addEventListener("click", () => {
            window.location.href = "game.html";
        });


        document.getElementById("restartBtn").addEventListener("click", () => {
            const keysToRemove = [
                "savedScore", "savedLives", "savedWave",
                "savedChickens", "savedRocks", "savedBullets", "savedEggs", "savedFriedChickens",
                "playerX", "playerY"
            ];
            keysToRemove.forEach(key => localStorage.removeItem(key));

            window.location.href = "game.html";
        });

        document.getElementById("exitBtn").addEventListener("click", () => {
            const keysToRemove = [
                "savedScore", "savedLives", "savedWave",
                "savedChickens", "savedRocks", "savedBullets", "savedEggs", "savedFriedChickens",
                "playerX", "playerY"
            ];
            keysToRemove.forEach(key => localStorage.removeItem(key));

            window.location.href = "../index.html";
        });
    </script>
</body>

</html>
