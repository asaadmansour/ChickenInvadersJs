<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Status - Chicken Invaders</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/gameover.css" />
</head>
<body>
    <div class="game-container">
        <div class="gameover-container">
            <h1 id="statusTitle">GAME OVER</h1>

            <div class="scores-container">
                <p class="final-score-text">FINAL SCORE: <span id="final-score">0</span></p>
                <input type="text" id="playerName" placeholder="ENTER PILOT NAME" maxlength="15" />
                <button type="button" class="submit-score">SUBMIT SCORE</button>
            </div>

            <div class="buttons">
                <button type="button" class="retry-button">RETRY</button>
                <button type="button" class="back-to-menu-button">BACK TO MENU</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script type="module" src="../scripts/pages/gameOver.js"></script>
</body>
</html>
