<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicken Invaders</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/gameover.css" />
    <link rel="stylesheet" href="./css/pause.css" />
  </head>
  <body>
    <div class="game-container">
      <div class="text">
        <h1 class="gradient-text" data-text="CHICKEN">CHICKEN</h1>
        <h1 class="gradient-text" data-text="INVADERS">INVADERS</h1>
      </div>

      <div class="buttons">
        <div class="border-button">
          <button class="play" type="button">Play</button>
        </div>
        <div class="border-button">
          <button class="instructions" type="button">Instructions</button>
        </div>
      </div>
      <footer>
        <div class="others">
          <p>Privacy Policy</p>
          <p>Terms of Use</p>
          <p>Contact</p>
        </div>
        <div class="socials">
          <div class="icons">
            <img src="./assets/facebook-icon.png" alt="Facebook" />
            <img src="./assets/twitter-icon.png" alt="Twitter" />
            <img src="./assets/instagram-icon.png" alt="Instagram" />
          </div>
        </div>
      </footer>

 
    </div>
    <script type="module" src="scripts/pages/main.js"></script>
  </body>
</html>
