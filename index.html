<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chicken Invaders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="icon" href="./assets/images/chicken.png" type="image/png" size="16x16">
</head>

<body>
  <nav class="top-nav">
    <div class="nav-left">
      <a href="/pages/scoreboard.html">
        <img src="/assets/images/leaderboard.png" alt="leaderboard" class="nav-icon" />
      </a>
    </div>
    <div class="nav-right">
      <a href="/pages/settings.html">
        <img src="/assets/images/settings.png" alt="Settings" class="nav-icon" id="settings"
          style="width: 110px; height: auto;" />
      </a>
    </div>
  </nav>

  <div class="game-container">
    <div class="text">
      <h1 class="gradient-text" data-text="CHICKEN">CHICKEN</h1>
      <h1 class="gradient-text" data-text="INVADERS">INVADERS</h1>
    </div>

    <div class="buttons">
      <div class="border-button">
        <button class="play" type="button">Play</button>
      </div>
      <div class="border-button">
        <button class="instructions" type="button">Instructions</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="others">
      <a href="/pages/privacy.html">
        <p>Privacy Policy</p>
      </a>
      <a href="/pages/legal.html">
        <p>Legal Terms</p>
      </a>
      <p>
        <a href="https://discord.gg/dXD748rQpc" target="_blank" rel="noopener">
          Contact
        </a>
      </p>
    </div>
    <div class="socials">
      <div class="icons">
        <a href="https://discord.gg/dXD748rQpc" target="_blank" rel="noopener">
          <img id="discord" src="assets/images/discord-icon2.png" alt="Discord" />
        </a>
        <a href="https://github.com/asaadmansour/ChickenInvadersJs" target="_blank" rel="noopener">
          <img id="github" src="/assets/images/github-icon2.png" alt="Github" />
        </a>
        <a href="https://youtube.com">
          <img src="assets/images/yt-icon2.png" alt="Youtube Demo" />
        </a>
      </div>
    </div>
  </footer>
  <script type="module" src="scripts/pages/main.js"></script>
</body>

</html>
